name: Update Mystic Scroll Team

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-mystic-team.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update partnership page
        run: python .github/scripts/update_mystic_team.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add partnership.html
          git commit -m "Replace personal profile with Mystic Scroll Team"
          git push
