name: Vendor Supabase JS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-supabase.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download pinned Supabase JS
        run: |
          mkdir -p vendor
          curl -fL --retry 3 --retry-delay 2 \
            'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9/dist/umd/supabase.js' \
            -o vendor/supabase.js
          test -s vendor/supabase.js
          grep -q 'createClient' vendor/supabase.js

      - name: Replace external Supabase CDN references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          root = Path('.')
          target = root / 'vendor' / 'supabase.js'
          pattern = re.compile(r'https://cdn\.jsdelivr\.net/npm/@supabase/supabase-js@2(?:\.[0-9]+(?:\.[0-9]+)?)?(?:/dist/umd/supabase(?:\.min)?\.js)?')

          changed = []
          for p in root.rglob('*.html'):
              if '.git' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8')
              rel = os.path.relpath(target, p.parent).replace('\\', '/') + '?v=2.110.9'
              new = pattern.sub(rel, text)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))
          print('Updated HTML files:', len(changed))
          for p in changed:
              print(' -', p)
          PY

      - name: Add third-party notice
        run: |
          cat > vendor/README.md <<'EOF'
          # Vendored Supabase JS

          - Package: `@supabase/supabase-js`
          - Version: `2.110.9`
          - File: `supabase.js`
          - Upstream: https://github.com/supabase/supabase-js
          - License: MIT

          This copy is self-hosted so GitHub Pages does not depend on jsDelivr to initialize authentication and database access.
          EOF

      - name: Commit vendored library
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/supabase.js vendor/README.md '*.html' 'forum/*.html' 2>/dev/null || true
          git add -u
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Vendor Supabase JS locally'
          git push
